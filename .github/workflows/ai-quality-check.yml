name: AI Quality Check

on:
  push:
    branches: [ main, master, develop, claude/** ]
    paths:
      - 'src/core/**'
      - 'src/prompts/**'
      - 'src/rag/**'
      - 'src/llm/**'
      - 'src/calculators/**'
      - 'src/conversation/**'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'src/core/**'
      - 'src/prompts/**'
      - 'src/rag/**'
      - 'src/llm/**'
      - 'src/calculators/**'
      - 'src/conversation/**'

jobs:
  ai-tests:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Test LangGraph State Machine
      env:
        REDIS_URL: redis://localhost:6379
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      run: |
        pytest tests/unit/test_*.py -v -k "not (integration or e2e)" --tb=short

    - name: Test RAG/CDC Knowledge Base
      run: |
        pytest tests/unit/test_cdc_loader.py -v --tb=short
        pytest tests/integration/test_rag.py -v --tb=short || true

    - name: Test Heuristics (Estimator + Scorer)
      run: |
        pytest tests/unit/test_estimator.py tests/unit/test_scorer.py -v --tb=short

    - name: Validate Prompts Structure
      run: |
        python -c "
        from src.prompts.system import SYSTEM_PROMPTS
        from src.prompts.examples import CONVERSATION_EXAMPLES
        print('✅ System prompts loaded successfully')
        print(f'   - {len(SYSTEM_PROMPTS)} system prompts found')
        print(f'   - {len(CONVERSATION_EXAMPLES)} conversation examples found')
        assert len(SYSTEM_PROMPTS) > 0, 'System prompts are empty'
        "

    - name: Check CDC Articles Coverage
      run: |
        python -c "
        from src.rag.cdc_loader import CDCLoader
        loader = CDCLoader()
        articles = loader.load_all_articles()
        print(f'✅ CDC Knowledge Base loaded')
        print(f'   - {len(articles)} articles found')
        assert len(articles) == 60, f'Expected 60 articles, found {len(articles)}'
        "
